# Android CI（配置用ワークフロー定義）

GitHub App の権限に `workflows` が無いため、このファイルは `.github/workflows/android.yml` へ
手動でコピーして使う（コピー後に `.github/workflows/` へ置いた時点で CI が動き出す）。

やること:

- `android/` で JVM ユニットテスト・Lint・Release APK ビルド
- `apksigner verify` で署名を確認
- タグ `v*` の push で GitHub Release に APK を添付（固定配布鍵で署名済み）

```yaml
name: Android CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build release APK
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK"
          cp "$APK" "call-5min-timer-v$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts).apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: call-5min-timer-apk
          path: android/call-5min-timer-v*.apk

      - name: Attach APK to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/call-5min-timer-v*.apk
          generate_release_notes: true
```

## 署名について

`android/keystore/call5min-timer.jks` は配布用の固定鍵で、リポジトリに置いてある。
これはアプリの配布 ID（公開情報）であり、秘密情報ではない。**この鍵を差し替えると
上書きインストールができなくなる**ので、CI でもローカルの Release ビルドでも同じ鍵を使う。
